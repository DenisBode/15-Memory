<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Game | Settings</title>
    <link rel="icon" type="image/png" href="assets/icons/controller-small.png" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/pages/settings.css" />
  </head>
  <body class="settings-page">
    <main class="page settings">
      <h1 class="settings__title">Settings</h1>

      <form id="settings-form" class="settings__form">
        <div class="settings__options">
          <fieldset class="settings__group">
            <legend class="settings__heading">
              <span class="settings__icon settings__icon--palette" aria-hidden="true"></span>
              Game themes
            </legend>
            <label class="radio-btn">
              <input type="radio" name="theme" value="code-vibes" checked />
              <span class="radio-btn__icon"></span>
              <span class="radio-btn__label">Code vibes theme</span>
            </label>
            <label class="radio-btn">
              <input type="radio" name="theme" value="gaming" />
              <span class="radio-btn__icon"></span>
              <span class="radio-btn__label">Gaming theme</span>
            </label>
            <label class="radio-btn">
              <input type="radio" name="theme" value="da-projects" />
              <span class="radio-btn__icon"></span>
              <span class="radio-btn__label">DA Projects theme</span>
            </label>
            <label class="radio-btn">
              <input type="radio" name="theme" value="foods" />
              <span class="radio-btn__icon"></span>
              <span class="radio-btn__label">Foods theme</span>
            </label>
          </fieldset>

          <fieldset class="settings__group">
            <legend class="settings__heading">
              <span class="settings__icon settings__icon--player" aria-hidden="true"></span>
              Choose player
            </legend>
            <label class="radio-btn">
              <input type="radio" name="player" value="blue" checked />
              <span class="radio-btn__icon"></span>
              <span class="radio-btn__label">Blue</span>
            </label>
            <label class="radio-btn">
              <input type="radio" name="player" value="orange" />
              <span class="radio-btn__icon"></span>
              <span class="radio-btn__label">Orange</span>
            </label>
          </fieldset>

          <fieldset class="settings__group">
            <legend class="settings__heading">
              <span class="settings__icon settings__icon--board" aria-hidden="true"></span>
              Board size
            </legend>
            <label class="radio-btn">
              <input type="radio" name="board" value="16" checked />
              <span class="radio-btn__icon"></span>
              <span class="radio-btn__label">16 cards</span>
            </label>
            <label class="radio-btn">
              <input type="radio" name="board" value="24" />
              <span class="radio-btn__icon"></span>
              <span class="radio-btn__label">24 cards</span>
            </label>
            <label class="radio-btn">
              <input type="radio" name="board" value="36" />
              <span class="radio-btn__icon"></span>
              <span class="radio-btn__label">36 cards</span>
            </label>
          </fieldset>
        </div>

        <div class="settings__preview">
          <img class="settings__preview-image" src="assets/previews/code-vibes.png" alt="Preview of the selected theme" />
        </div>

        <div class="settings-bar">
          <span class="settings-bar__value" id="summary-theme">Code vibes theme</span>
          <span class="settings-bar__divider" aria-hidden="true"></span>
          <span class="settings-bar__value" id="summary-player">Blue</span>
          <span class="settings-bar__divider" aria-hidden="true"></span>
          <span class="settings-bar__value" id="summary-board">16 cards</span>
          <button type="submit" class="btn-small">
            <img class="btn-small__icon" src="assets/icons/play.png" alt="" aria-hidden="true" />
            Start
          </button>
        </div>
      </form>
    </main>
    <script type="module" src="dist/settings.js"></script>
  </body>
</html>
