<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory- Game</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/pages/game.css" />
  </head>
  <body>
    <main class="game-container">
      <section class="game-panel">
        <header class="game-header">
          <div class="game-header__players">
            <div class="game-header__player_one">Player 1 <span id="score">10</span></div>
            <div class="game-header__player_two">Player 2 <span id="score2">0</span></div>
          </div>

          <div class="game-header__current">Current Player<span id="current-player">1</span></div>

          <button class="btn btn--exit game-header__exit" type="button">EXIT</button>
        </header>

        <div id="game-board"></div>
      </section>
    </main>
  </body>
</html>
