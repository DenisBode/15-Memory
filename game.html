<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Game</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/pages/game.css" />
  </head>
  <body class="game-page">
    <main class="game-container">
      <section class="game-panel">
        <header class="game-header">
          <div class="game-header__scores">
            <span class="game-header__score game-header__score--blue">Blue <span id="score">0</span></span>
            <span class="game-header__score game-header__score--orange">Orange <span id="score2">0</span></span>
          </div>

          <div class="game-header__current">
            Current player:
            <div class="game-header__player-icon" id="current-player-icon" aria-hidden="true"></div>
          </div>

          <button class="btn btn--exit game-header__exit" type="button">
            <span class="btn__exit-icon" aria-hidden="true"></span>
            Exit game
          </button>
        </header>

        <div id="game-board"></div>
      </section>
    </main>

    <dialog id="exit-dialog" class="popup exit-dialog">
      <p class="popup__title">Are you sure you want to quit the game?</p>
      <div class="popup__buttons">
        <button class="popup-btn popup-btn--primary" type="button" id="exit-dialog-back">Back to game</button>
        <button class="popup-btn popup-btn--secondary" type="button" id="exit-dialog-exit">Exit game</button>
      </div>
    </dialog>

    <section class="result" id="result" hidden>
      <div class="result__view" id="result-game-over">
        <h2 class="result__gameover">Game over</h2>
        <p class="result__final">Final score</p>
        <div class="result__scores">
          <span class="result__score result__score--blue">
            <span class="result__score-square" aria-hidden="true"></span>
            <span class="result__score-pawn" aria-hidden="true"></span>
            <span class="result__score-name">Blue</span>
            <span id="result-score-1">0</span>
          </span>
          <span class="result__score result__score--orange">
            <span class="result__score-square" aria-hidden="true"></span>
            <span class="result__score-pawn" aria-hidden="true"></span>
            <span class="result__score-name">Orange</span>
            <span id="result-score-2">0</span>
          </span>
        </div>
      </div>

      <div class="result__view" id="result-winner" hidden>
        <img class="result__confetti" src="assets/result/confetti.png" alt="" />
        <p class="result__label" id="result-label"></p>
        <h2 class="result__winner" id="result-winner-name"></h2>
        <div class="result__media">
          <div class="result__icon-box">
            <div class="result__pawn" aria-hidden="true"></div>
            <img class="result__trophy" src="assets/result/trophy.png" alt="" />
            <div class="result__scale" aria-hidden="true"></div>
          </div>
        </div>
        <div class="result__buttons">
          <button class="popup-btn popup-btn--primary" type="button" id="result-restart">New game</button>
          <a class="popup-btn popup-btn--secondary" href="index.html" id="result-home">Back to start</a>
        </div>
      </div>
    </section>

    <script type="module" src="dist/game.js"></script>
  </body>
</html>
